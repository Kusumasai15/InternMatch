name: InternMatch checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: internmatch_test
          POSTGRES_USER: internmatch_test
          # Disposable runner-only credentials, no production secrets.
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U internmatch_test -d internmatch_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: SQLite unit and account tests
        run: python -m pytest backend/tests -q
      - name: PostgreSQL account and catalog integration tests
        env:
          TEST_DATABASE_URL: postgresql://internmatch_test:${{ github.run_id }}-${{ github.run_attempt }}-test@127.0.0.1:5432/internmatch_test
        run: python -m pytest backend/tests/test_accounts.py -q
